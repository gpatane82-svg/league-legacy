  </g>
  <text x="133" y="81" text-anchor="middle" font-family="Impact, Arial Black, Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="3" fill="#5d4933" transform="rotate(4 133 65.5)" filter="url(#rough)">ARCHIVED</text>
